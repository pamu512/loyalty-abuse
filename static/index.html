<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loyalty Abuse Analytics</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; }
    h1 { margin-bottom: 0.25rem; }
    .meta { color: #555; margin-bottom: 1.5rem; }
    section { margin-bottom: 2rem; }
    table { border-collapse: collapse; min-width: 20rem; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.75rem; text-align: left; }
    th { background: #f4f4f4; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Loyalty Abuse Analytics</h1>
  <p class="meta" id="meta">Loading…</p>

  <section>
    <h2>Friction mix</h2>
    <table id="friction-table">
      <thead><tr><th>Friction</th><th>Count</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2>Top reasons</h2>
    <table id="reasons-table">
      <thead><tr><th>Reason</th><th>Count</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2>Typology rates</h2>
    <table id="typology-table">
      <thead><tr><th>Typology</th><th>Rate</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <script>
    function fillTable(tbody, rows, cols) {
      tbody.replaceChildren();
      for (const row of rows) {
        const tr = document.createElement("tr");
        for (const col of cols) {
          const td = document.createElement("td");
          td.textContent = row[col];
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
    }

    async function loadSummary() {
      const meta = document.getElementById("meta");
      try {
        const res = await fetch("/v1/analytics/summary");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        meta.textContent = `${data.decision_count} decisions`;

        const frictionRows = Object.entries(data.friction_counts || {})
          .map(([friction, count]) => ({ friction, count }))
          .sort((a, b) => b.count - a.count);
        fillTable(
          document.querySelector("#friction-table tbody"),
          frictionRows,
          ["friction", "count"]
        );

        fillTable(
          document.querySelector("#reasons-table tbody"),
          data.top_reasons || [],
          ["reason", "count"]
        );

        const typologyRows = Object.entries(data.typology_rates || {})
          .map(([typology, rate]) => ({ typology, rate: (rate * 100).toFixed(1) + "%" }))
          .sort((a, b) => parseFloat(b.rate) - parseFloat(a.rate));
        fillTable(
          document.querySelector("#typology-table tbody"),
          typologyRows,
          ["typology", "rate"]
        );
      } catch (err) {
        meta.innerHTML = `<span class="error">Failed to load summary: ${err.message}</span>`;
      }
    }

    loadSummary();
  </script>
</body>
</html>
