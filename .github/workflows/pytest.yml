name: pytest

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
        env:
          # Fail-closed stubs: no vendor secrets in CI.
          INCOGNIA_CLIENT_ID: ""
          INCOGNIA_CLIENT_SECRET: ""
          INCOGNIA_POLICY_ID: ""
