services:
  api:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - loyalty_data:/data

  api-prod:
    build: .
    ports:
      - "8080:8080"
    environment:
      LOYALTY_ABUSE_DB: /data/loyalty.db
      LOYALTY_ABUSE_BOOTSTRAP_ADMIN_KEY: ${LOYALTY_ABUSE_BOOTSTRAP_ADMIN_KEY:?bootstrap key required}
    volumes:
      - loyalty_data:/data
    profiles: ["prod"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  loyalty_data:
